spring.application.name=edu06
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName= EDU-06;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8080

app.jwt.secret=EDU06-local-development-secret-change-before-deployment-2026-very-long-key

# Luu tru file minh chung
app.upload.minh-chung-dir=uploads/minh-chung
app.upload.bao-cao-dir=uploads/bao-cao

# Gioi han dung luong upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB